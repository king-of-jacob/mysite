<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>all hail jacob</title>
  <style>
    :root {
      --bg: #0d0705;
      --ember: #ff7a1a;
      --flame: #ffd25a;
      --ash: #fff3df;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ash);
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      overflow: hidden;
    }
    #boom {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    main {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem;
      text-align: center;
      pointer-events: none;
    }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 12vw, 9rem);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: 0.02em;
      color: var(--ash);
      text-shadow: 0 0 24px rgba(255, 140, 40, 0.8), 0 4px 0 #7a1d00, 0 8px 30px rgba(0, 0, 0, 0.8);
    }
    p {
      margin: 0;
      font-family: system-ui, sans-serif;
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
      pointer-events: auto;
    }
    .btn {
      display: inline-block;
      padding: 0.8rem 2rem;
      background: var(--ember);
      color: #1a0800;
      font-size: 1.5rem;
      letter-spacing: 0.04em;
      text-decoration: none;
      border: 3px solid #1a0800;
      border-radius: 6px;
      box-shadow: 0 6px 0 #7a1d00, 0 10px 24px rgba(0, 0, 0, 0.6);
      transition: transform 0.08s, box-shadow 0.08s, background 0.15s;
    }
    .btn:hover { background: var(--flame); }
    .btn:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 #7a1d00, 0 4px 12px rgba(0, 0, 0, 0.6);
    }
    .btn:focus-visible { outline: 4px solid var(--ash); outline-offset: 4px; }
  </style>
</head>
<body>
  <canvas id="boom" aria-hidden="true"></canvas>

  <main>
    <h1>Hello, World!</h1>
    <p>This is a test of kingship.</p>
    <nav class="links">
      <a class="btn" href="Goatfight.htm">goat fight</a>
      <!-- Add more links the same way: <a class="btn" href="Page.htm">label</a> -->
    </nav>
  </main>

  <script>
    (function () {
      var canvas = document.getElementById('boom');
      var ctx = canvas.getContext('2d');
      var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var W, H, dpr;
      var sparks = [], smoke = [], rings = [], flashes = [];

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = '#0d0705';
        ctx.fillRect(0, 0, W, H);
      }
      window.addEventListener('resize', resize);
      resize();

      function rand(a, b) { return a + Math.random() * (b - a); }

      function explode(x, y, scale) {
        scale = scale || rand(0.6, 1.6);
        var n = Math.round((calm ? 30 : 70) * scale);
        for (var i = 0; i < n; i++) {
          var a = rand(0, Math.PI * 2);
          var s = rand(1, 9) * scale;
          sparks.push({
            x: x, y: y,
            vx: Math.cos(a) * s, vy: Math.sin(a) * s,
            life: 0, max: rand(35, 80),
            size: rand(1.5, 4.5) * scale,
            hue: rand(10, 55)
          });
        }
        for (var j = 0; j < 8 * scale; j++) {
          var b = rand(0, Math.PI * 2);
          var t = rand(0.3, 2.2);
          smoke.push({
            x: x, y: y,
            vx: Math.cos(b) * t, vy: Math.sin(b) * t - 0.4,
            life: 0, max: rand(70, 130),
            size: rand(20, 45) * scale
          });
        }
        rings.push({ x: x, y: y, r: 4, max: 140 * scale, life: 0 });
        if (!calm) flashes.push({ x: x, y: y, r: 160 * scale, life: 0 });
      }

      function frame() {
        // fade previous frame for motion trails
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(13, 7, 5, 0.22)';
        ctx.fillRect(0, 0, W, H);

        // smoke
        for (var i = smoke.length - 1; i >= 0; i--) {
          var m = smoke[i];
          m.x += m.vx; m.y += m.vy; m.vx *= 0.98; m.size += 0.4; m.life++;
          if (m.life > m.max) { smoke.splice(i, 1); continue; }
          var ma = 0.12 * (1 - m.life / m.max);
          ctx.fillStyle = 'rgba(60, 40, 30, ' + ma + ')';
          ctx.beginPath(); ctx.arc(m.x, m.y, m.size, 0, 6.283); ctx.fill();
        }

        ctx.globalCompositeOperation = 'lighter';

        // flashes
        for (var f = flashes.length - 1; f >= 0; f--) {
          var fl = flashes[f];
          fl.life++;
          if (fl.life > 10) { flashes.splice(f, 1); continue; }
          var g = ctx.createRadialGradient(fl.x, fl.y, 0, fl.x, fl.y, fl.r);
          var fa = 0.7 * (1 - fl.life / 10);
          g.addColorStop(0, 'rgba(255, 240, 200, ' + fa + ')');
          g.addColorStop(0.4, 'rgba(255, 150, 40, ' + fa * 0.5 + ')');
          g.addColorStop(1, 'rgba(255, 80, 0, 0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(fl.x, fl.y, fl.r, 0, 6.283); ctx.fill();
        }

        // shockwaves
        for (var r = rings.length - 1; r >= 0; r--) {
          var rg = rings[r];
          rg.life++;
          rg.r += (rg.max - rg.r) * 0.09;
          var ra = 1 - rg.r / rg.max;
          if (ra < 0.03) { rings.splice(r, 1); continue; }
          ctx.strokeStyle = 'rgba(255, 190, 90, ' + ra * 0.7 + ')';
          ctx.lineWidth = 3 * ra + 0.5;
          ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, 6.283); ctx.stroke();
        }

        // sparks
        for (var k = sparks.length - 1; k >= 0; k--) {
          var p = sparks[k];
          p.x += p.vx; p.y += p.vy;
          p.vx *= 0.96; p.vy = p.vy * 0.96 + 0.08;
          p.life++;
          if (p.life > p.max) { sparks.splice(k, 1); continue; }
          var t = p.life / p.max;
          ctx.fillStyle = 'hsla(' + p.hue + ', 100%, ' + (65 - t * 25) + '%, ' + (1 - t) + ')';
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 - t * 0.6), 0, 6.283); ctx.fill();
        }

        requestAnimationFrame(frame);
      }

      function schedule() {
        explode(rand(0.05, 0.95) * W, rand(0.08, 0.92) * H);
        if (!calm && Math.random() < 0.35) {
          setTimeout(function () { explode(rand(0.05, 0.95) * W, rand(0.08, 0.92) * H); }, rand(60, 200));
        }
        setTimeout(schedule, calm ? 2500 : rand(250, 700));
      }

      // click or tap empty space to detonate
      window.addEventListener('pointerdown', function (e) {
        if (e.target.closest && e.target.closest('a')) return;
        explode(e.clientX, e.clientY, 1.4);
      });

      explode(W / 2, H / 2, 2);
      schedule();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
